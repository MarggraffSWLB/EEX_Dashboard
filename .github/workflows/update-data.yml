name: Update Day-Ahead prices
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write
jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Fetch Energy-Charts data
        shell: python
        run: |
          import datetime as dt, json, urllib.parse, urllib.request
          year=dt.datetime.now(dt.timezone.utc).year
          params=urllib.parse.urlencode({"bzn":"DE-LU","start":f"{year}-01-01","end":f"{year}-12-31"})
          url="https://api.energy-charts.info/price?"+params
          req=urllib.request.Request(url,headers={"User-Agent":"EEX-Dashboard-GitHubActions/1.0"})
          with urllib.request.urlopen(req,timeout=60) as response:
              data=json.load(response)
          data["generated_at"]=dt.datetime.now(dt.timezone.utc).isoformat()
          with open("data.json","w",encoding="utf-8") as f:
              json.dump(data,f,ensure_ascii=False,separators=(",",":"))
          print(f"Saved {len(data.get('price',[]))} price values.")
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update Day-Ahead prices"
          git push
