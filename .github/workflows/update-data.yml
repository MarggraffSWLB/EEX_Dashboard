name: Update electricity prices

on:
  workflow_dispatch:

  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install playwright

      - name: Install Chromium
        run: |
          playwright install --with-deps chromium

      - name: Fetch Energy-Charts data
        shell: python
        run: |
          import json
          import datetime as dt
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from playwright.sync_api import sync_playwright

          TZ = ZoneInfo("Europe/Berlin")
          now = dt.datetime.now(TZ)

          start_date = now.date() - dt.timedelta(days=2)
          end_date = now.date() + dt.timedelta(days=1)

          url = (
              "https://www.energy-charts.info/"
              "charts/price_spot_market/chart.htm"
              "?c=DE"
              "&l=de"
              "&minuteInterval=15min"
              "&timeslider=0"
          )

          print("Loading:", url)

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)

              page = browser.new_page(
                  viewport={
                      "width": 1600,
                      "height": 1000
                  }
              )

              page.goto(
                  url,
                  wait_until="domcontentloaded",
                  timeout=120000
              )

              page.wait_for_function(
                  """
                  () =>
                      window.Highcharts &&
                      window.Highcharts.charts &&
                      window.Highcharts.charts.some(
                          c => c && c.series && c.series.length > 0
                      )
                  """,
                  timeout=120000
              )

              page.wait_for_timeout(10000)

              result = page.evaluate(
                  """
                  () => {
                      const charts =
                          (window.Highcharts &&
                           window.Highcharts.charts)
                          ? window.Highcharts.charts
                          : [];

                      return charts
                          .filter(c => c && c.series)
                          .map(c => ({
                              series: c.series.map(s => ({
                                  name: s.name,
                                  data: s.data.map(p => ({
                                      x: p.x,
                                      y: p.y
                                  }))
                              }))
                          }));
                  }
                  """
              )

              browser.close()

          print("Anzahl Charts:", len(result))

          all_series = []

          for chart_index, chart in enumerate(result):
              print("")
              print("Chart", chart_index)

              for series in chart["series"]:
                  print(
                      "  ",
                      repr(series["name"]),
                      len(series["data"])
                  )

                  all_series.append(series)

          # ---------------------------------------------------------
          # Gewünschte Serien exakt auswählen
          # ---------------------------------------------------------

          day_ahead_name = "Day Ahead Auktion (DE-LU)"

          intraday_name = (
              "Intraday kontinuierlich, "
              "15 Minuten Durchschnittspreis (DE-LU)"
          )

          day_ahead = None
          intraday = None

          for series in all_series:

              if series["name"] == day_ahead_name:
                  day_ahead = series["data"]

              elif series["name"] == intraday_name:
                  intraday = series["data"]


          if day_ahead is None:
              raise Exception(
                  "Day-Ahead-Serie nicht gefunden."
              )

          if intraday is None:
              raise Exception(
                  "Intraday-Serie nicht gefunden."
              )


          print("")
          print(
              "Day Ahead Rohdaten:",
              len(day_ahead)
          )

          print(
              "Intraday Rohdaten:",
              len(intraday)
          )


          # ---------------------------------------------------------
          # Zeitstempel untersuchen
          # ---------------------------------------------------------

          print("")
          print("Beispiel-Zeitstempel:")

          if day_ahead:
              print(
                  "Day Ahead:",
                  day_ahead[0]["x"]
              )

          if intraday:
              print(
                  "Intraday:",
                  intraday[0]["x"]
              )


          # ---------------------------------------------------------
          # Zeitfenster
          # ---------------------------------------------------------

          start_dt = dt.datetime.combine(
              start_date,
              dt.time.min,
              tzinfo=TZ
          )

          end_dt = dt.datetime.combine(
              end_date,
              dt.time.max,
              tzinfo=TZ
          )

          start_ms = int(
              start_dt.timestamp() * 1000
          )

          end_ms = int(
              end_dt.timestamp() * 1000
          )


          print("")
          print(
              "Start:",
              start_dt,
              "=>",
              start_ms
          )

          print(
              "End:",
              end_dt,
              "=>",
              end_ms
          )


          # ---------------------------------------------------------
          # Daten bereinigen
          # ---------------------------------------------------------

          def clean(data):

              cleaned = []

              for point in data:

                  x = point.get("x")
                  y = point.get("y")

                  if x is None:
                      continue

                  if y is None:
                      continue


                  # Energy-Charts / Highcharts kann je nach
                  # Darstellung Sekunden oder Millisekunden liefern.
                  #
                  # Unix-Zeit in Sekunden liegt aktuell bei ca.
                  # 1,7 Milliarden.
                  #
                  # Unix-Zeit in Millisekunden liegt aktuell bei ca.
                  # 1.700.000.000.000.
                  #
                  # Deshalb automatisch erkennen.

                  x = float(x)

                  if x < 100000000000:
                      timestamp_ms = int(x * 1000)
                  else:
                      timestamp_ms = int(x)


                  if timestamp_ms < start_ms:
                      continue

                  if timestamp_ms > end_ms:
                      continue


                  cleaned.append(
                      {
                          "timestamp": timestamp_ms,
                          "price": float(y)
                      }
                  )


              cleaned.sort(
                  key=lambda p: p["timestamp"]
              )


              # Doppelte Zeitpunkte entfernen

              unique = {}

              for point in cleaned:

                  unique[
                      point["timestamp"]
                  ] = point["price"]


              return [
                  {
                      "timestamp": timestamp,
                      "price": price
                  }

                  for timestamp, price
                  in sorted(
                      unique.items()
                  )
              ]


          day_ahead_clean = clean(
              day_ahead
          )

          intraday_clean = clean(
              intraday
          )


          print("")
          print(
              "Day Ahead nach Filter:",
              len(day_ahead_clean)
          )

          print(
              "Intraday nach Filter:",
              len(intraday_clean)
          )


          if len(day_ahead_clean) == 0:

              raise Exception(
                  "Day-Ahead-Daten nach Filter leer."
              )

          if len(intraday_clean) == 0:

              raise Exception(
                  "Intraday-Daten nach Filter leer."
              )

          print("")
          print(
              "Day Ahead nach Filter:",
              len(day_ahead_clean)
          )

          print(
              "Intraday nach Filter:",
              len(intraday_clean)
          )

          if len(day_ahead_clean) == 0:
              raise Exception(
                  "Day-Ahead-Daten nach Filter leer."
              )

          if len(intraday_clean) == 0:
              raise Exception(
                  "Intraday-Daten nach Filter leer."
              )

          output = {
              "generated_at":
                  now.isoformat(),

              "timezone":
                  "Europe/Berlin",

              "start":
                  start_date.isoformat(),

              "end":
                  end_date.isoformat(),

              "day_ahead":
                  day_ahead_clean,

              "intraday":
                  intraday_clean
          }

          Path("data.json").write_text(
              json.dumps(
                  output,
                  ensure_ascii=False,
                  separators=(",", ":")
              ),
              encoding="utf-8"
          )

          print("")
          print("data.json erfolgreich geschrieben.")


      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          git diff --cached --quiet || \
            git commit -m "Update electricity prices"

          git push
