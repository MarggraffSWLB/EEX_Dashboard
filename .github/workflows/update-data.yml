name: Update electricity prices

on:
  schedule:
    # Alle 15 Minuten aktualisieren
    - cron: "*/15 * * * *"

  # Manuelles Starten über GitHub Actions erlauben
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. Repository laden
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Python installieren
      # ---------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ---------------------------------------------------------
      # 3. Playwright installieren
      # ---------------------------------------------------------
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      # ---------------------------------------------------------
      # 4. Energy-Charts auslesen
      # ---------------------------------------------------------
      - name: Fetch Energy-Charts data
        run: |

          python <<'PY'

          from playwright.sync_api import sync_playwright
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          import json
          import math


          # =====================================================
          # Einstellungen
          # =====================================================

          TIMEZONE = ZoneInfo("Europe/Berlin")

          URL = (
              "https://www.energy-charts.info/"
              "charts/price_spot_market/chart.htm"
              "?c=DE"
              "&l=de"
              "&minuteInterval=15min"
              "&timeslider=0"
          )

          DAY_AHEAD_NAME = "Day Ahead Auktion (DE-LU)"

          INTRADAY_NAME = (
              "Intraday kontinuierlich, "
              "15 Minuten Durchschnittspreis (DE-LU)"
          )


          # =====================================================
          # Zeitbereich bestimmen
          #
          # Heute + die beiden vorherigen Tage + morgen
          # =====================================================

          now = datetime.now(TIMEZONE)

          today = now.replace(
              hour=0,
              minute=0,
              second=0,
              microsecond=0
          )

          start = today - timedelta(days=2)

          end = today + timedelta(days=2) - timedelta(milliseconds=1)

          print("")
          print("=====================================================")
          print("Energy-Charts Datenimport")
          print("=====================================================")
          print("Jetzt:", now)
          print("Start:", start)
          print("Ende :", end)
          print("")


          # =====================================================
          # Hilfsfunktion:
          # Kategorie aus Highcharts in Zeitstempel umwandeln
          # =====================================================

          def parse_category(category):

              if category is None:
                  return None

              # -------------------------------------------------
              # Bereits numerischer Zeitstempel
              # -------------------------------------------------

              if isinstance(category, (int, float)):

                  if not math.isfinite(category):
                      return None

                  # Sekunden -> Millisekunden
                  if category < 10_000_000_000:
                      return int(category * 1000)

                  # bereits Millisekunden
                  return int(category)


              text = str(category).strip()

              if not text:
                  return None


              # -------------------------------------------------
              # Numerischer String
              # -------------------------------------------------

              try:

                  number = float(text)

                  if math.isfinite(number):

                      if number < 10_000_000_000:
                          return int(number * 1000)

                      return int(number)

              except ValueError:
                  pass


              # -------------------------------------------------
              # ISO-Datumsformate
              # -------------------------------------------------

              iso_text = text.replace("Z", "+00:00")

              try:

                  dt = datetime.fromisoformat(iso_text)

                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=TIMEZONE)

                  return int(dt.timestamp() * 1000)

              except ValueError:
                  pass


              # -------------------------------------------------
              # Deutsche Datumsformate
              # -------------------------------------------------

              formats = [

                  "%d.%m.%Y %H:%M",
                  "%d.%m.%Y %H:%M:%S",
                  "%d.%m.%Y, %H:%M",
                  "%d.%m.%Y, %H:%M:%S",

                  "%d.%m.%Y",
              ]

              for fmt in formats:

                  try:

                      dt = datetime.strptime(text, fmt)
                      dt = dt.replace(tzinfo=TIMEZONE)

                      return int(dt.timestamp() * 1000)

                  except ValueError:
                      pass


              # -------------------------------------------------
              # Falls Energy-Charts nur "06.09. 12:15" liefert
              # -------------------------------------------------

              formats_without_year = [

                  "%d.%m. %H:%M",
                  "%d.%m. %H:%M:%S",
              ]

              for fmt in formats_without_year:

                  try:

                      dt = datetime.strptime(text, fmt)

                      dt = dt.replace(
                          year=today.year,
                          tzinfo=TIMEZONE
                      )

                      return int(dt.timestamp() * 1000)

                  except ValueError:
                      pass


              return None


          # =====================================================
          # Browser starten
          # =====================================================

          with sync_playwright() as p:

              browser = p.chromium.launch(
                  headless=True
              )

              page = browser.new_page(
                  viewport={
                      "width": 1920,
                      "height": 1080
                  }
              )

              print("Öffne Energy-Charts...")

              page.goto(
                  URL,
                  wait_until="networkidle",
                  timeout=120000
              )

              print("Seite geladen.")

              # -------------------------------------------------
              # Warten bis Highcharts vorhanden ist
              # -------------------------------------------------

              page.wait_for_function(
                  """
                  () =>
                      window.Highcharts &&
                      window.Highcharts.charts &&
                      window.Highcharts.charts.length > 0
                  """,
                  timeout=120000
              )

              # Etwas zusätzliche Zeit für die Daten
              page.wait_for_timeout(10000)


              # =================================================
              # Highcharts auslesen
              # =================================================

              result = page.evaluate(
                  """
                  () => {

                      const charts =
                          (
                              window.Highcharts &&
                              window.Highcharts.charts
                          )
                          ? window.Highcharts.charts
                          : [];

                      const chart = charts.find(
                          c =>
                              c &&
                              c.series &&
                              c.series.some(
                                  s =>
                                      s.name ===
                                      "Day Ahead Auktion (DE-LU)"
                              ) &&
                              c.series.some(
                                  s =>
                                      s.name ===
                                      "Intraday kontinuierlich, 15 Minuten Durchschnittspreis (DE-LU)"
                              )
                      );


                      if (!chart) {

                          return {
                              error:
                                  "Passender Energy-Charts Chart nicht gefunden"
                          };

                      }


                      const categories =
                          chart.xAxis &&
                          chart.xAxis[0] &&
                          chart.xAxis[0].categories
                              ? chart.xAxis[0].categories
                              : [];


                      return {

                          categories: categories,

                          series:

                              chart.series.map(
                                  s => ({

                                      name: s.name,

                                      data:

                                          s.data.map(
                                              p => ({

                                                  x: p.x,

                                                  y: p.y,

                                                  category:
                                                      categories[p.x] ??
                                                      null

                                              })
                                          )

                                  })
                              )

                      };

                  }
                  """
              )


              browser.close()


          # =====================================================
          # Prüfen, ob Chart gefunden wurde
          # =====================================================

          if result.get("error"):

              raise Exception(
                  result["error"]
              )


          categories = result.get(
              "categories",
              []
          )


          series = result.get(
              "series",
              []
          )


          print("")
          print("=====================================================")
          print("Highcharts-Auswertung")
          print("=====================================================")

          print(
              "Anzahl Kategorien:",
              len(categories)
          )


          # =====================================================
          # Kategorien anzeigen
          #
          # Das ist wichtig für die Kontrolle, welches Format
          # Energy-Charts tatsächlich verwendet.
          # =====================================================

          print("")
          print("Beispiel-Kategorien:")

          for category in categories[:10]:

              print(
                  repr(category)
              )


          # =====================================================
          # Serien anzeigen
          # =====================================================

          print("")
          print("Gefundene Serien:")

          for s in series:

              print(
                  "  ",
                  repr(s.get("name")),
                  len(s.get("data", []))
              )


          # =====================================================
          # Exakt die beiden gewünschten Serien auswählen
          #
          # WICHTIG:
          # Keine Suche mit "Day Ahead" oder "Intraday",
          # damit nicht versehentlich EXAA oder andere Serien
          # verwendet werden.
          # =====================================================

          day_ahead_raw = None
          intraday_raw = None


          for s in series:

              name = s.get("name")

              if name == DAY_AHEAD_NAME:

                  day_ahead_raw = s.get(
                      "data",
                      []
                  )

              elif name == INTRADAY_NAME:

                  intraday_raw = s.get(
                      "data",
                      []
                  )


          if day_ahead_raw is None:

              raise Exception(
                  "Day-Ahead-Serie nicht gefunden."
              )


          if intraday_raw is None:

              raise Exception(
                  "Intraday-Serie nicht gefunden."
              )


          print("")
          print(
              "Day Ahead Rohdaten:",
              len(day_ahead_raw)
          )

          print(
              "Intraday Rohdaten:",
              len(intraday_raw)
          )


          # =====================================================
          # Daten mit Kategorien verbinden
          # =====================================================

          def convert_series(raw_data):

              converted = []

              for point in raw_data:

                  y = point.get("y")

                  category = point.get(
                      "category"
                  )


                  # Kein Wert
                  if y is None:
                      continue


                  # Zeit bestimmen
                  timestamp = parse_category(
                      category
                  )


                  if timestamp is None:
                      continue


                  # Ungültige Zahlen ignorieren
                  try:

                      value = float(y)

                      if not math.isfinite(value):
                          continue

                  except (TypeError, ValueError):

                      continue


                  converted.append(
                      {
                          "timestamp": timestamp,
                          "price": value
                      }
                  )


              return converted


          day_ahead_all = convert_series(
              day_ahead_raw
          )

          intraday_all = convert_series(
              intraday_raw
          )


          # =====================================================
          # Kontrollausgabe
          # =====================================================

          print("")
          print("=====================================================")
          print("Nach Umwandlung")
          print("=====================================================")

          print(
              "Day Ahead:",
              len(day_ahead_all)
          )

          print(
              "Intraday:",
              len(intraday_all)
          )


          if day_ahead_all:

              print(
                  "Erster DA Punkt:",
                  datetime.fromtimestamp(
                      day_ahead_all[0]["timestamp"] / 1000,
                      TIMEZONE
                  ),
                  day_ahead_all[0]["price"]
              )

              print(
                  "Letzter DA Punkt:",
                  datetime.fromtimestamp(
                      day_ahead_all[-1]["timestamp"] / 1000,
                      TIMEZONE
                  ),
                  day_ahead_all[-1]["price"]
              )


          if intraday_all:

              print(
                  "Erster ID Punkt:",
                  datetime.fromtimestamp(
                      intraday_all[0]["timestamp"] / 1000,
                      TIMEZONE
                  ),
                  intraday_all[0]["price"]
              )

              print(
                  "Letzter ID Punkt:",
                  datetime.fromtimestamp(
                      intraday_all[-1]["timestamp"] / 1000,
                      TIMEZONE
                  ),
                  intraday_all[-1]["price"]
              )


          # =====================================================
          # Zeitbereich filtern
          # =====================================================

          start_ms = int(
              start.timestamp() * 1000
          )

          end_ms = int(
              end.timestamp() * 1000
          )


          day_ahead = [

              p

              for p in day_ahead_all

              if start_ms
              <= p["timestamp"]
              <= end_ms

          ]


          intraday = [

              p

              for p in intraday_all

              if start_ms
              <= p["timestamp"]
              <= end_ms

          ]


          print("")
          print("=====================================================")
          print("Nach Zeitfilter")
          print("=====================================================")

          print(
              "Day Ahead:",
              len(day_ahead)
          )

          print(
              "Intraday:",
              len(intraday)
          )


          # =====================================================
          # Sicherheitsprüfung
          # =====================================================

          if not day_ahead:

              raise Exception(
                  "Day-Ahead-Daten nach Filter leer."
              )


          if not intraday:

              raise Exception(
                  "Intraday-Daten nach Filter leer."
              )


          # =====================================================
          # Nach Zeit sortieren
          # =====================================================

          day_ahead.sort(
              key=lambda x: x["timestamp"]
          )

          intraday.sort(
              key=lambda x: x["timestamp"]
          )


          # =====================================================
          # Duplikate entfernen
          # =====================================================

          def remove_duplicates(data):

              result = {}
              
              for point in data:

                  result[
                      point["timestamp"]
                  ] = point["price"]

              return [

                  {
                      "timestamp": timestamp,
                      "price": price
                  }

                  for timestamp, price
                  in sorted(result.items())

              ]


          day_ahead = remove_duplicates(
              day_ahead
          )

          intraday = remove_duplicates(
              intraday
          )


          # =====================================================
          # JSON schreiben
          # =====================================================

          output = {

              "generated_at":
                  now.isoformat(),

              "timezone":
                  "Europe/Berlin",

              "start":
                  start.date().isoformat(),

              "end":
                  end.date().isoformat(),

              "day_ahead":
                  day_ahead,

              "intraday":
                  intraday

          }


          with open(
              "data.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  separators=(",", ":")
              )


          # =====================================================
          # Abschlussinformationen
          # =====================================================

          print("")
          print("=====================================================")
          print("data.json erfolgreich geschrieben")
          print("=====================================================")

          print(
              "Day Ahead Punkte:",
              len(day_ahead)
          )

          print(
              "Intraday Punkte:",
              len(intraday)
          )

          print(
              "Datei: data.json"
          )

          PY

      # ---------------------------------------------------------
      # 5. Änderungen speichern und zu GitHub pushen
      # ---------------------------------------------------------
      - name: Commit and push data
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          if git diff --cached --quiet; then
            echo "Keine Änderungen an data.json."
          else
            git commit -m "Update electricity prices"
            git push
          fi
