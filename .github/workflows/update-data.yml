name: Update electricity prices

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Energy-Charts Data via API
        shell: python
        run: |
          import json
          import requests
          import datetime as dt
          from pathlib import Path
          from zoneinfo import ZoneInfo

          TZ = ZoneInfo("Europe/Berlin")
          now = dt.datetime.now(TZ)

          file_path = Path("data.json")
          existing_data = {}
          if file_path.exists():
              try:
                  existing_data = json.loads(file_path.read_text(encoding="utf-8"))
              except Exception:
                  pass

          start_date = now.date() - dt.timedelta(days=3)
          end_date = now.date() + dt.timedelta(days=1)

          day_ahead_points = []
          intraday_points = []

          # 1. Fetch 15-minute interval data directly for Intraday + Day Ahead
          url_15m = f"https://api.energy-charts.info/price?bzn=DE-LU&start={start_date.isoformat()}&end={end_date.isoformat()}&time_step=15m"
          print("Fetching 15m API:", url_15m)

          try:
              res = requests.get(url_15m, timeout=30)
              if res.status_code == 200:
                  data = res.json()
                  timestamps = data.get("unix_seconds", [])
                  
                  # Look for intraday values under 'price_intraday' or alternative keys
                  prices_id = (
                      data.get("price_intraday") 
                      or data.get("price_intraday_15min") 
                      or data.get("intraday_price") 
                      or []
                  )
                  
                  prices_da = data.get("price", [])

                  for ts, p in zip(timestamps, prices_id):
                      if p is not None:
                          intraday_points.append({"timestamp": ts * 1000, "price": float(p)})

                  for ts, p in zip(timestamps, prices_da):
                      if p is not None:
                          day_ahead_points.append({"timestamp": ts * 1000, "price": float(p)})

          except Exception as e:
              print(f"Error fetching 15m API: {e}")

          # 2. Fallback for Day-Ahead if 15m query returned no auction data
          if not day_ahead_points:
              print("Fetching hourly Day-Ahead fallback...")
              try:
                  url_hourly = f"https://api.energy-charts.info/price?bzn=DE-LU&start={start_date.isoformat()}&end={end_date.isoformat()}"
                  res_h = requests.get(url_hourly, timeout=30)
                  if res_h.status_code == 200:
                      d_h = res_h.json()
                      ts_h = d_h.get("unix_seconds", [])
                      p_h = d_h.get("price", [])
                      for ts, p in zip(ts_h, p_h):
                          if p is not None:
                              day_ahead_points.append({"timestamp": ts * 1000, "price": float(p)})
              except Exception as e:
                  print(f"Hourly fallback failed: {e}")

          # 3. Existing data fallbacks
          if not day_ahead_points and "day_ahead" in existing_data:
              day_ahead_points = existing_data["day_ahead"]
          if not intraday_points and "intraday" in existing_data:
              intraday_points = existing_data["intraday"]

          output = {
              "generated_at": now.isoformat(),
              "timezone": "Europe/Berlin",
              "start": start_date.isoformat(),
              "end": end_date.isoformat(),
              "day_ahead": sorted(day_ahead_points, key=lambda x: x["timestamp"]),
              "intraday": sorted(intraday_points, key=lambda x: x["timestamp"])
          }

          file_path.write_text(
              json.dumps(output, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8"
          )

          print(f"Done. DA points: {len(output['day_ahead'])}, Intraday points: {len(output['intraday'])}")

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]"

          git add data.json
          git diff --cached --quiet || git commit -m "Update electricity prices"
          git push
